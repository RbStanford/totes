<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a73e8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Totes</title>
<style>
  :root {
    --bg: #f2f4f8; --surface: #ffffff; --text: #1b1f27; --muted: #5f6877; --line: #e2e6ee;
    --primary: #1a73e8; --on-primary: #ffffff; --tonal: #e3edfd; --on-tonal: #0b3d91;
    --danger: #c5221f; --ok: #137333; --chip: #eef1f6; --shadow: 0 1px 2px rgba(20,30,50,.08), 0 4px 14px rgba(20,30,50,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11141a; --surface: #1b2029; --text: #eef1f6; --muted: #9aa4b5; --line: #2a303c;
      --primary: #8ab4f8; --on-primary: #0b1b3a; --tonal: #26364f; --on-tonal: #cfe0ff;
      --danger: #f28b82; --ok: #81c995; --chip: #262c37; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  [hidden] { display: none !important; }
  button, input { font: inherit; color: inherit; }
  a { color: var(--primary); }

  .appbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px;
    padding: calc(10px + env(safe-area-inset-top)) 14px 10px; background: var(--primary); color: var(--on-primary); }
  .appbar .titles { flex: 1; min-width: 0; }
  .appbar h1 { margin: 0; font-size: 1.25rem; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .appbar .sub { font-size: .85rem; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,.18); color: inherit;
    display: grid; place-items: center; font-size: 1.3rem; text-decoration: none; cursor: pointer; }
  #bar { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: #ffb300; z-index: 20; transition: width .25s; }

  main { padding: 14px 14px calc(110px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
  .search { position: relative; margin-bottom: 14px; }
  .search input { width: 100%; padding: 13px 16px 13px 44px; border-radius: 28px; border: 1px solid var(--line);
    background: var(--surface); box-shadow: var(--shadow); font-size: 1.05rem; }
  .search .mag { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .muted { color: var(--muted); }
  .section-title { margin: 6px 4px 10px; font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .tile { display: block; text-decoration: none; color: inherit; background: var(--surface); border-radius: 18px;
    overflow: hidden; box-shadow: var(--shadow); }
  .tile .pic { aspect-ratio: 4 / 3; background: var(--chip); display: grid; place-items: center; font-size: 2.2rem; color: var(--muted); overflow: hidden; }
  .tile .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .info { padding: 10px 12px 12px; }
  .chip { display: inline-block; padding: 2px 9px; border-radius: 10px; background: var(--tonal); color: var(--on-tonal); font-size: .75rem; font-weight: 700; }
  .tile .name { font-weight: 650; margin-top: 6px; line-height: 1.2; }
  .tile .meta { color: var(--muted); font-size: .82rem; margin-top: 3px; }

  .card { display: flex; gap: 12px; background: var(--surface); border-radius: 18px; padding: 12px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .card .thumb { width: 84px; height: 84px; flex: none; border-radius: 12px; background: var(--chip); display: grid; place-items: center;
    color: var(--muted); font-size: 1.6rem; overflow: hidden; }
  .card .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .card .name { font-weight: 650; }
  .card .detail { color: var(--muted); font-size: .9rem; margin: 2px 0 6px; white-space: pre-wrap; }
  .card .where { font-size: .88rem; margin-top: auto; }
  .card .actions { margin-top: auto; display: flex; align-items: center; gap: 8px; }
  .stepper { display: inline-flex; align-items: center; background: var(--chip); border-radius: 22px; }
  .stepper button { width: 40px; height: 36px; border: 0; background: transparent; font-size: 1.3rem; cursor: pointer; border-radius: 22px; }
  .stepper span { min-width: 30px; text-align: center; font-weight: 650; }
  .more { margin-left: auto; width: 38px; height: 36px; border: 0; background: var(--chip); border-radius: 18px; cursor: pointer; font-size: 1.1rem; }

  .actions-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 26px;
    border: 0; font-weight: 650; cursor: pointer; background: var(--tonal); color: var(--on-tonal); text-decoration: none; }
  .btn.primary { background: var(--primary); color: var(--on-primary); }
  .btn.danger { background: transparent; color: var(--danger); border: 1.5px solid var(--danger); }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: .5; cursor: default; }
  .actions-row .wide { grid-column: 1 / -1; }

  .fab { position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 6; min-height: 56px; padding: 0 22px; border-radius: 28px;
    border: 0; background: var(--primary); color: var(--on-primary); font-weight: 700; box-shadow: 0 6px 18px rgba(20,30,50,.3); cursor: pointer; }

  .empty { text-align: center; color: var(--muted); padding: 40px 10px; }
  .empty .big { font-size: 2.4rem; }

  .scrim { position: fixed; inset: 0; background: rgba(10,14,22,.5); z-index: 30; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-width: 640px; margin: 0 auto; background: var(--surface);
    border-radius: 24px 24px 0 0; padding: 10px 18px calc(20px + env(safe-area-inset-bottom)); max-height: 90vh; overflow: auto;
    box-shadow: 0 -8px 30px rgba(0,0,0,.3); animation: up .18s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: .6; } to { transform: none; opacity: 1; } }
  .sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
  .sheet h2 { margin: 0 0 10px; font-size: 1.2rem; }
  .field { display: block; margin-bottom: 12px; }
  .field > span { display: block; font-size: .8rem; color: var(--muted); margin: 0 4px 4px; font-weight: 600; }
  .field input[type=text] { width: 100%; padding: 13px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--bg); }
  .field input:focus { outline: 2px solid var(--primary); border-color: transparent; }
  .row { display: flex; gap: 10px; align-items: center; }
  .row > * { flex: 1; }
  .photo-pick { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .photo-pick .prev { width: 64px; height: 64px; border-radius: 12px; background: var(--chip); overflow: hidden; display: grid; place-items: center; color: var(--muted); flex: none; }
  .photo-pick .prev img { width: 100%; height: 100%; object-fit: cover; }
  .photo-pick input[type=file] { display: none; }

  .nfc-state { text-align: center; padding: 14px 6px 6px; }
  .nfc-icon { width: 92px; height: 92px; margin: 4px auto 12px; border-radius: 50%; display: grid; place-items: center; font-size: 2.6rem;
    background: var(--tonal); color: var(--on-tonal); }
  .nfc-icon.wait { animation: pulse 1.2s ease-in-out infinite; }
  .nfc-icon.ok { background: #d7f0df; color: var(--ok); }
  .nfc-icon.bad { background: #fbdcda; color: var(--danger); }
  @media (prefers-color-scheme: dark) { .nfc-icon.ok { background: #1e3a2a; } .nfc-icon.bad { background: #4a2523; } }
  @keyframes pulse { 0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(26,115,232,.45); } 50% { transform: scale(1.06); box-shadow: 0 0 0 16px rgba(26,115,232,0); } }
  .nfc-state h3 { margin: 4px 0; font-size: 1.15rem; }
  .nfc-state p { margin: 4px 0 12px; color: var(--muted); }
  .addr { display: flex; gap: 8px; margin: 10px 0 4px; }
  .addr input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); font-size: .8rem; }
  .stack { display: grid; gap: 10px; margin-top: 8px; }

  #toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 40;
    background: #2b2f38; color: #fff; padding: 12px 18px; border-radius: 22px; box-shadow: var(--shadow); max-width: 90vw; text-align: center; }
  #toast.err { background: #b3261e; }
</style>
</head>
<body>
<div id="bar"></div>
<header class="appbar">
  <a id="back" class="icon-btn" href="./" hidden aria-label="Back">&#8592;</a>
  <div class="titles"><h1 id="title">Totes</h1><div class="sub" id="subtitle"></div></div>
</header>
<main id="main"></main>
<button class="fab" id="fab" hidden></button>
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" hidden></section>
<div id="toast" hidden></div>

<script>
var API = 'https://script.google.com/macros/s/AKfycbyrIXo0ApuL5HZNZiUsGF4fRC55eI-2-vl1mHbbn27Jpy0l6zF7WeIaybkVdfV_vh86/exec';
var BASE = location.origin + location.pathname.replace(/[^\/]*$/, '');
var $ = function (id) { return document.getElementById(id); };
var params = new URLSearchParams(location.search);

/* ---------- helpers ---------- */
function h(tag, props) {
  var e = document.createElement(tag);
  props = props || {};
  Object.keys(props).forEach(function (k) {
    var v = props[k];
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  });
  for (var i = 2; i < arguments.length; i++) {
    [].concat(arguments[i]).forEach(function (c) {
      if (c == null || c === false) return;
      e.append(c.nodeType ? c : document.createTextNode(String(c)));
    });
  }
  return e;
}

var busy = 0;
function progress(on) {
  busy += on ? 1 : -1;
  $('bar').style.width = busy > 0 ? '70%' : '100%';
  if (busy <= 0) { busy = 0; setTimeout(function () { if (!busy) $('bar').style.width = '0'; }, 250); }
}

// Cookies are omitted on purpose: Google rejects script.google.com requests that carry a sign-in session.
function call(p, post) {
  progress(true);
  var req = post
    ? fetch(API, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(p) })
    : fetch(API + '?' + new URLSearchParams(p), { credentials: 'omit' });
  return req.then(function (r) { return r.json(); }).then(function (d) {
    progress(false);
    if (d.error) throw new Error(d.error);
    return d;
  }, function (e) { progress(false); throw new Error('No connection. Try again.'); });
}

var toastTimer;
function toast(msg, isErr) {
  var t = $('toast');
  t.textContent = msg; t.className = isErr ? 'err' : ''; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.hidden = true; }, isErr ? 5000 : 2200);
}
function fail(e) { toast(e && e.message ? e.message : String(e), true); }

function setBar(title, sub, back) {
  $('title').textContent = title;
  $('subtitle').textContent = sub || '';
  $('back').hidden = !back;
  document.title = title + (sub ? ' - ' + sub : '');
}

function shrink(file) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var s = Math.min(1, 1024 / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = function () { reject(new Error('Could not read that photo')); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------- sheets ---------- */
var sheetOnClose = null;
function openSheet(content, onClose) {
  var s = $('sheet');
  s.replaceChildren(h('div', { class: 'grab' }), content);
  s.hidden = false; $('scrim').hidden = false;
  sheetOnClose = onClose || null;
}
function closeSheet() {
  $('sheet').hidden = true; $('scrim').hidden = true;
  if (sheetOnClose) { var f = sheetOnClose; sheetOnClose = null; f(); }
}
$('scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('sheet').hidden) closeSheet(); });

function photoPicker(initialUrl) {
  var state = { dataUrl: '', remove: false };
  var prev = h('div', { class: 'prev' }, initialUrl ? h('img', { src: initialUrl, alt: '' }) : '📷');
  var input = h('input', { type: 'file', accept: 'image/*' });
  var label = h('button', { type: 'button', class: 'btn', text: initialUrl ? 'Change photo' : 'Add photo' });
  label.addEventListener('click', function () { input.click(); });
  input.addEventListener('change', function () {
    var f = input.files[0];
    if (!f) return;
    shrink(f).then(function (d) {
      state.dataUrl = d; state.remove = false;
      prev.replaceChildren(h('img', { src: d, alt: '' }));
      label.textContent = 'Change photo';
    }).catch(fail);
  });
  var node = h('div', { class: 'photo-pick' }, prev, label, input);
  return { node: node, state: state, prev: prev };
}

function qtyField(value) {
  var n = value;
  var num = h('span', { text: String(n) });
  var minus = h('button', { type: 'button', text: '−', 'aria-label': 'Less' });
  var plus = h('button', { type: 'button', text: '+', 'aria-label': 'More' });
  minus.addEventListener('click', function () { if (n > 0) { n--; num.textContent = n; } });
  plus.addEventListener('click', function () { if (n < 9999) { n++; num.textContent = n; } });
  return { node: h('div', { class: 'stepper' }, minus, num, plus), get: function () { return n; } };
}

/* ---------- home ---------- */
var timer = null, seq = 0;

function pic(url, fallback) {
  return url ? h('img', { src: url, alt: '', loading: 'lazy' }) : fallback;
}

function toteTile(t) {
  return h('a', { class: 'tile', href: '?t=' + encodeURIComponent(t.id) },
    h('div', { class: 'pic' }, pic(t.thumbUrl, '📦')),
    h('div', { class: 'info' },
      h('span', { class: 'chip', text: t.id }),
      h('div', { class: 'name', text: t.name }),
      h('div', { class: 'meta', text: t.count + (t.count === 1 ? ' item' : ' items') + (t.location ? ' · ' + t.location : '') })));
}

function resultCard(r) {
  return h('a', { class: 'card', href: '?t=' + encodeURIComponent(r.toteId), style: 'text-decoration:none;color:inherit' },
    h('div', { class: 'thumb' }, pic(r.thumbUrl, '📦')),
    h('div', { class: 'body' },
      h('div', { class: 'name', text: r.item + (r.quantity !== 1 ? '  ×' + r.quantity : '') }),
      r.detail ? h('div', { class: 'detail', text: r.detail }) : null,
      h('div', { class: 'where' }, h('span', { class: 'chip', text: r.toteId }), ' ' + r.toteName + (r.location ? ' · ' + r.location : ''))));
}

function startHome() {
  setBar('Totes', '', false);
  var input = h('input', { type: 'search', placeholder: 'Search every tote', autocomplete: 'off', 'aria-label': 'Search' });
  var results = h('div');
  var tiles = h('div');
  var info = { nextId: 'T-001', totes: [] };
  var readBtn = h('button', { type: 'button', class: 'btn primary', text: '📖 Read tag' });
  var writeBtn = h('button', { type: 'button', class: 'btn primary', text: '🏷 Write tag' });
  readBtn.addEventListener('click', readTagSheet);
  writeBtn.addEventListener('click', function () { writePickerSheet(info); });
  $('main').replaceChildren(
    h('div', { class: 'actions-row' }, readBtn, writeBtn),
    h('div', { class: 'search' }, h('span', { class: 'mag', text: '🔍' }), input), results, tiles);

  function runSearch() {
    var q = input.value, mine = ++seq;
    history.replaceState(null, '', q.trim() ? '?q=' + encodeURIComponent(q) : location.pathname);
    if (!q.trim()) { results.replaceChildren(); tiles.hidden = false; return; }
    tiles.hidden = true;
    call({ action: 'search', q: q }).then(function (d) {
      if (mine !== seq) return;
      results.replaceChildren(
        h('div', { class: 'section-title', text: d.count === 0 ? 'Nothing found' : d.count + (d.count === 1 ? ' result' : ' results') }),
        d.results.map(resultCard));
    }).catch(fail);
  }
  input.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(runSearch, 300); });
  input.value = params.get('q') || '';

  $('fab').hidden = false; $('fab').textContent = '＋ New tote';
  $('fab').onclick = function () { newToteSheet(info.nextId); };

  call({ action: 'totes' }).then(function (d) {
    info.nextId = d.nextId;
    info.totes = d.totes;
    if (!d.totes.length) {
      tiles.replaceChildren(h('div', { class: 'empty' }, h('div', { class: 'big', text: '📦' }), h('p', { text: 'No totes yet. Tap New tote to start.' })));
    } else {
      tiles.replaceChildren(h('div', { class: 'section-title', text: 'All totes' }), h('div', { class: 'grid' }, d.totes.map(toteTile)));
    }
    if (input.value.trim()) runSearch();
  }).catch(fail);
}

function newToteSheet(nextId) {
  var name = h('input', { type: 'text', maxlength: '100', placeholder: 'e.g. Camping gear', autocomplete: 'off' });
  var loc = h('input', { type: 'text', maxlength: '100', placeholder: 'e.g. Garage shelf 2', autocomplete: 'off' });
  try { loc.value = localStorage.getItem('lastLocation') || ''; } catch (e) {}
  var save = h('button', { type: 'button', class: 'btn primary block', text: 'Create ' + nextId });
  save.addEventListener('click', function () {
    var n = name.value.trim(), l = loc.value.trim();
    if (!n || !l) { toast('Enter a name and a location', true); return; }
    save.disabled = true;
    call({ action: 'createTote', t: nextId, name: n, location: l }).then(function () {
      try { localStorage.setItem('lastLocation', l); } catch (e) {}
      location.href = '?t=' + nextId + '&tag=1';
    }).catch(function (e) { save.disabled = false; fail(e); });
  });
  openSheet(h('div', null,
    h('h2', { text: 'New tote' }),
    h('p', { class: 'muted', style: 'margin:0 0 12px' }, 'It will be ', h('b', { text: nextId }), '. Next you can write its NFC sticker.'),
    h('label', { class: 'field' }, h('span', { text: 'Name' }), name),
    h('label', { class: 'field' }, h('span', { text: 'Location' }), loc),
    save));
  setTimeout(function () { name.focus(); }, 150);
}

/* ---------- tote screen ---------- */
var TOTE = null, DATA = null;

function itemCard(it) {
  var qtyNum = h('span', { text: String(it.quantity) });
  var cur = it.quantity;
  function bump(delta) {
    var next = cur + delta;
    if (next < 0 || next > 9999) return;
    cur = next; qtyNum.textContent = cur;
    call({ action: 'setQuantity', t: TOTE, row: it.rowNumber, qty: cur }).catch(function (e) { fail(e); loadTote(); });
  }
  var minus = h('button', { type: 'button', text: '−', 'aria-label': 'Less' });
  var plus = h('button', { type: 'button', text: '+', 'aria-label': 'More' });
  minus.addEventListener('click', function () { bump(-1); });
  plus.addEventListener('click', function () { bump(1); });
  var more = h('button', { type: 'button', class: 'more', text: '⋯', 'aria-label': 'Edit ' + it.item });
  more.addEventListener('click', function () { editItemSheet(it); });
  var thumbInner = it.thumbUrl ? h('a', { href: it.viewUrl, target: '_blank', rel: 'noopener' }, h('img', { src: it.thumbUrl, alt: it.item })) : '📷';
  return h('div', { class: 'card' },
    h('div', { class: 'thumb' }, thumbInner),
    h('div', { class: 'body' },
      h('div', { class: 'name', text: it.item }),
      it.detail ? h('div', { class: 'detail', text: it.detail }) : null,
      h('div', { class: 'actions' }, h('div', { class: 'stepper' }, minus, qtyNum, plus), more)));
}

function renderTote(d) {
  DATA = d;
  $('fab').hidden = true;
  var main = $('main');
  if (!d.exists) {
    setBar(d.id + ' not found', '', true);
    main.replaceChildren(h('div', { class: 'empty' }, h('div', { class: 'big', text: '🔍' }),
      h('p', { text: d.id + ' is not in the sheet yet.' }),
      h('button', { type: 'button', class: 'btn primary', text: 'Create ' + d.id, onclick: function () { newToteSheet(d.id); } })));
    return;
  }
  setBar(d.name, d.id + (d.location ? ' · ' + d.location : ''), true);
  var addBtn = h('button', { type: 'button', class: 'btn', text: '＋ Add item' });
  addBtn.addEventListener('click', addItemSheet);
  var nfcBtn = h('button', { type: 'button', class: 'btn primary', text: '🏷 Write NFC tag' });
  nfcBtn.addEventListener('click', function () { nfcSheet(TOTE); });
  var manyBtn = h('button', { type: 'button', class: 'btn wide', text: '🖼 Add several photos at once' });
  manyBtn.addEventListener('click', function () { addManyPhotos(d.items.length); });
  var list = d.items.length
    ? d.items.map(itemCard)
    : h('div', { class: 'empty' }, h('div', { class: 'big', text: '📥' }), h('p', { text: 'Nothing in this tote yet.' }));
  main.replaceChildren(
    h('div', { class: 'actions-row' }, nfcBtn, addBtn, manyBtn),
    h('div', { class: 'section-title', text: d.items.length + (d.items.length === 1 ? ' item' : ' items') + (d.updated ? ' · updated ' + d.updated : '') }),
    h('div', null, list));
}

function loadTote() {
  return call({ action: 'tote', t: TOTE }).then(renderTote);
}

function startTote(id) {
  TOTE = id;
  setBar(id, '', true);
  $('main').replaceChildren(h('div', { class: 'empty', text: 'Loading…' }));
  loadTote().then(function () {
    if (params.get('tag') === '1' && DATA && DATA.exists) {
      history.replaceState(null, '', '?t=' + id);
      nfcSheet(id);
    }
  }).catch(fail);
}

// Pick several photos from the gallery: each becomes an item, oldest photo first.
function addManyPhotos(existing) {
  var input = h('input', { type: 'file', accept: 'image/*', multiple: true });
  input.addEventListener('change', function () {
    var files = Array.prototype.slice.call(input.files).sort(function (a, b) { return a.lastModified - b.lastModified; });
    if (!files.length) return;
    var i = 0, added = 0;
    (function next() {
      if (i >= files.length) { toast('Added ' + added + (added === 1 ? ' item' : ' items')); return; }
      toast('Adding photo ' + (i + 1) + ' of ' + files.length + '…');
      shrink(files[i]).then(function (data) {
        return call({ action: 'addItem', t: TOTE, item: 'New item ' + (existing + i + 1), qty: 1, detail: 'Needs a description', photo: data }, true);
      }).then(function (d) { renderTote(d); added++; i++; next(); })
        .catch(function (e) { fail(e); if (added) renderTote(DATA); });
    })();
  });
  input.click();
}

function addItemSheet() {
  var name = h('input', { type: 'text', maxlength: '100', placeholder: 'Item name', autocomplete: 'off' });
  var detail = h('input', { type: 'text', maxlength: '200', placeholder: 'Detail (optional)', autocomplete: 'off' });
  var qty = qtyField(1);
  var photo = photoPicker('');
  var save = h('button', { type: 'button', class: 'btn primary block', text: 'Add item' });
  save.addEventListener('click', function () {
    var n = name.value.trim();
    if (!n) { toast('Enter an item name', true); return; }
    save.disabled = true;
    var p = { action: 'addItem', t: TOTE, item: n, qty: qty.get(), detail: detail.value.trim() };
    if (photo.state.dataUrl) p.photo = photo.state.dataUrl;
    call(p, !!photo.state.dataUrl).then(function (d) { closeSheet(); renderTote(d); toast('Added'); })
      .catch(function (e) { save.disabled = false; fail(e); });
  });
  openSheet(h('div', null,
    h('h2', { text: 'Add item' }),
    h('label', { class: 'field' }, h('span', { text: 'Name' }), name),
    h('label', { class: 'field' }, h('span', { text: 'Detail' }), detail),
    h('div', { class: 'row', style: 'margin-bottom:12px' }, h('span', { class: 'muted', text: 'Quantity' }), qty.node),
    photo.node, save));
  setTimeout(function () { name.focus(); }, 150);
}

function editItemSheet(it) {
  var name = h('input', { type: 'text', maxlength: '100', value: it.item, autocomplete: 'off' });
  var detail = h('input', { type: 'text', maxlength: '200', value: it.detail, placeholder: 'Detail (optional)', autocomplete: 'off' });
  var photo = photoPicker(it.thumbUrl);
  var save = h('button', { type: 'button', class: 'btn primary block', text: 'Save' });
  var del = h('button', { type: 'button', class: 'btn danger block', text: 'Delete item' });
  var rmPhoto = it.photoId ? h('button', { type: 'button', class: 'btn', text: 'Remove photo' }) : null;
  var armed = false;
  save.addEventListener('click', function () {
    var n = name.value.trim();
    if (!n) { toast('Enter an item name', true); return; }
    save.disabled = true;
    var chain = call({ action: 'updateDetails', t: TOTE, row: it.rowNumber, item: n, detail: detail.value.trim() });
    if (photo.state.dataUrl) chain = chain.then(function () { return call({ action: 'setPhoto', t: TOTE, row: it.rowNumber, photo: photo.state.dataUrl }, true); });
    else if (photo.state.remove && it.photoId) chain = chain.then(function () { return call({ action: 'clearPhoto', t: TOTE, row: it.rowNumber }); });
    chain.then(function (d) { closeSheet(); renderTote(d); toast('Saved'); }).catch(function (e) { save.disabled = false; fail(e); });
  });
  if (rmPhoto) rmPhoto.addEventListener('click', function () {
    photo.state.remove = true; photo.state.dataUrl = '';
    photo.prev.replaceChildren('📷'); rmPhoto.hidden = true; toast('Photo will be removed when you save');
  });
  del.addEventListener('click', function () {
    if (!armed) { armed = true; del.textContent = 'Tap again to delete'; setTimeout(function () { armed = false; del.textContent = 'Delete item'; }, 3500); return; }
    del.disabled = true;
    call({ action: 'removeItem', t: TOTE, row: it.rowNumber }).then(function (d) { closeSheet(); renderTote(d); toast('Deleted'); })
      .catch(function (e) { del.disabled = false; fail(e); });
  });
  openSheet(h('div', null,
    h('h2', { text: 'Edit item' }),
    h('label', { class: 'field' }, h('span', { text: 'Name' }), name),
    h('label', { class: 'field' }, h('span', { text: 'Detail' }), detail),
    photo.node, rmPhoto, h('div', { class: 'stack' }, save, del)));
}

/* ---------- home: read a tag, pick a tote to write ---------- */
function writePickerSheet(info) {
  if (!info.totes.length) { toast('Totes are still loading. Try again in a moment.', true); return; }
  var rows = info.totes.map(function (t) {
    var b = h('button', { type: 'button', class: 'btn block', style: 'justify-content:flex-start;text-align:left;margin-bottom:8px;min-height:54px' },
      h('span', { class: 'chip', text: t.id }), h('span', { text: t.name }));
    b.addEventListener('click', function () { closeSheet(); nfcSheet(t.id); });
    return b;
  });
  var add = h('button', { type: 'button', class: 'btn primary block', text: '＋ New tote' });
  add.addEventListener('click', function () { closeSheet(); newToteSheet(info.nextId); });
  openSheet(h('div', null, h('h2', { text: 'Write a tag for which tote?' }), rows, add));
}

function readTagSheet() {
  var supported = 'NDEFReader' in window;
  var ctl = null;
  var box = h('div', { class: 'nfc-state' });
  function stop() { if (ctl) { try { ctl.abort(); } catch (e) {} ctl = null; } }
  function btn(label, cls, fn) { return h('button', { type: 'button', class: 'btn ' + (cls || ''), text: label, onclick: fn }); }
  function view(icon, cls, title, text, buttons) {
    box.replaceChildren(
      h('div', { class: 'nfc-icon ' + cls, text: icon }),
      h('h3', { text: title }),
      text ? h('p', { text: text }) : null,
      h('div', { class: 'stack' }, buttons || []));
  }
  function scan() {
    stop(); ctl = new AbortController();
    view('📲', 'wait', 'Hold phone to the sticker', 'Reading the tag…', [btn('Cancel', '', closeSheet)]);
    var ndef = new NDEFReader();
    ndef.scan({ signal: ctl.signal }).then(function () {
      ndef.onreading = function (ev) {
        var rec = ev.message.records[0], data = '';
        try { data = new TextDecoder().decode(rec.data); } catch (e) {}
        stop();
        var m = data.indexOf(BASE) === 0 ? /[?&]t=(T-\d{3})/.exec(data) : null;
        if (m) {
          view('✓', 'ok', 'Tote ' + m[1], 'Opening it…', [btn('Open now', 'primary', function () { location.href = BASE + '?t=' + m[1]; })]);
          setTimeout(function () { location.href = BASE + '?t=' + m[1]; }, 700);
        } else if (!data) {
          view('✗', 'bad', 'This tag is empty', 'Nothing is written on it yet. Use Write tag to set it up.', [btn('Scan again', 'primary', scan), btn('Close', '', closeSheet)]);
        } else {
          view('✗', 'bad', 'Not a tote tag', data.replace(/^https?:\/\//, ''), [btn('Scan again', 'primary', scan), btn('Close', '', closeSheet)]);
        }
      };
      ndef.onreadingerror = function () {
        stop();
        view('✗', 'bad', 'Could not read the tag', 'Hold it steady against the back of the phone and try again.', [btn('Try again', 'primary', scan), btn('Close', '', closeSheet)]);
      };
    }).catch(function (e) {
      if (e && e.name === 'AbortError') return;
      view('✗', 'bad', 'Could not start NFC', (e && e.name === 'NotAllowedError') ? 'NFC permission was denied. Allow NFC for this site in Chrome and try again.' : 'Turn NFC on in the phone settings and try again.', [btn('Close', '', closeSheet)]);
    });
  }
  if (!supported) {
    view('⚠', 'bad', 'Can’t read tags here', 'Tag reading works in Chrome on an Android phone with NFC turned on. You can also just tap a sticker with the screen on and it opens its tote.', [btn('Close', '', closeSheet)]);
  } else {
    scan();
  }
  openSheet(h('div', null, box), stop);
}

/* ---------- NFC tag: write, verify, lock ---------- */
function nfcSheet(toteId) {
  var tagUrl = BASE + '?t=' + toteId;
  var supported = 'NDEFReader' in window;
  var canLock = supported && 'makeReadOnly' in NDEFReader.prototype;
  var ctl = null;
  var box = h('div', { class: 'nfc-state' });
  var wrapped = false;

  function stop() { if (ctl) { try { ctl.abort(); } catch (e) {} ctl = null; } }
  function view(icon, cls, title, text, buttons) {
    box.replaceChildren(
      h('div', { class: 'nfc-icon ' + cls, text: icon }),
      h('h3', { text: title }),
      text ? h('p', { text: text }) : null,
      h('div', { class: 'stack' }, buttons || []));
  }
  function btn(label, cls, fn) { return h('button', { type: 'button', class: 'btn ' + (cls || ''), text: label, onclick: fn }); }

  function idle() {
    stop();
    if (!supported) {
      var inp = h('input', { type: 'text', readonly: true, value: tagUrl });
      view('⚠', 'bad', 'Can’t write tags here', 'Tag writing works in Chrome on an Android phone with NFC turned on. You can still copy the address below into any NFC app.', [
        h('div', { class: 'addr' }, inp, btn('Copy', '', function () { copyText(tagUrl, inp); })),
        btn('Close', '', closeSheet)]);
      return;
    }
    view('🏷', '', 'Write the tag for ' + toteId, 'Tap Write, then hold the back of your phone against the sticker.', [
      btn('Write tag', 'primary', doWrite), btn('Check a tag', '', doVerify), btn('Close', '', closeSheet)]);
  }

  function explain(e) {
    var n = e && e.name;
    if (n === 'NotAllowedError') return 'NFC permission was denied. Allow NFC for this site in Chrome and try again.';
    if (n === 'NotSupportedError') return 'NFC is off or not available. Turn NFC on in the phone settings.';
    if (n === 'AbortError') return 'Cancelled.';
    if (n === 'NetworkError') return 'The tag moved away or couldn’t be written. Hold it steady and try again.';
    return (e && e.message) || 'Something went wrong.';
  }

  function doWrite() {
    stop(); ctl = new AbortController();
    view('📲', 'wait', 'Hold phone to the sticker', 'Keep it still until it says done.', [btn('Cancel', '', idle)]);
    var ndef = new NDEFReader();
    ndef.write({ records: [{ recordType: 'url', data: tagUrl }] }, { overwrite: true, signal: ctl.signal }).then(function () {
      var b = [btn('Verify tag', 'primary', doVerify)];
      if (canLock) b.push(btn('Lock tag (permanent)', '', confirmLock));
      b.push(btn('Done', '', closeSheet));
      view('✓', 'ok', 'Tag written', tagUrl.replace(/^https:\/\//, ''), b);
    }).catch(function (e) {
      if (e && e.name === 'AbortError') return;
      view('✗', 'bad', 'Write failed', explain(e), [btn('Try again', 'primary', doWrite), btn('Close', '', closeSheet)]);
    });
  }

  function doVerify() {
    stop(); ctl = new AbortController();
    view('📲', 'wait', 'Tap the sticker to check it', 'Hold your phone against the tag.', [btn('Cancel', '', idle)]);
    var ndef = new NDEFReader();
    ndef.scan({ signal: ctl.signal }).then(function () {
      ndef.onreading = function (ev) {
        var rec = ev.message.records[0], data = '';
        try { data = new TextDecoder().decode(rec.data); } catch (e) {}
        stop();
        if (data === tagUrl) {
          view('✓', 'ok', 'Tag is correct', tagUrl.replace(/^https:\/\//, ''), [btn('Done', 'primary', closeSheet)]);
        } else if (!data) {
          view('✗', 'bad', 'Tag is empty', 'Nothing readable is on this sticker yet.', [btn('Write it', 'primary', doWrite), btn('Close', '', closeSheet)]);
        } else {
          view('✗', 'bad', 'Wrong address on tag', data.replace(/^https:\/\//, ''), [btn('Write ' + toteId + ' over it', 'primary', doWrite), btn('Close', '', closeSheet)]);
        }
      };
      ndef.onreadingerror = function () {
        stop();
        view('✗', 'bad', 'Could not read the tag', 'Hold it steady against the back of the phone and try again.', [btn('Try again', 'primary', doVerify), btn('Close', '', closeSheet)]);
      };
    }).catch(function (e) {
      if (e && e.name === 'AbortError') return;
      view('✗', 'bad', 'Could not start NFC', explain(e), [btn('Close', '', closeSheet)]);
    });
  }

  function confirmLock() {
    view('🔒', '', 'Lock this tag?', 'Locking is permanent. The sticker can never be changed again. Only do this after Verify says it is correct.', [
      btn('Lock it for good', 'danger', doLock), btn('Not now', '', idle)]);
  }

  function doLock() {
    stop(); ctl = new AbortController();
    view('📲', 'wait', 'Hold phone to the sticker to lock it', '', [btn('Cancel', '', idle)]);
    new NDEFReader().makeReadOnly({ signal: ctl.signal }).then(function () {
      view('🔒', 'ok', 'Tag locked', 'It now only reads.', [btn('Done', 'primary', closeSheet)]);
    }).catch(function (e) {
      if (e && e.name === 'AbortError') return;
      view('✗', 'bad', 'Lock failed', explain(e), [btn('Try again', 'primary', doLock), btn('Close', '', closeSheet)]);
    });
  }

  function copyText(text, input) {
    var ok = function () { toast('Copied'); };
    var fb = function () { input.select(); input.setSelectionRange(0, 999); try { document.execCommand('copy'); ok(); } catch (e) { toast('Press and hold the address to copy', true); } };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fb); else fb();
  }

  idle();
  openSheet(h('div', null, box), stop);
}

/* ---------- start ---------- */
var t = (params.get('t') || '').trim().toUpperCase();
if (/^T-\d{3}$/.test(t)) startTote(t); else startHome();
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function () {}); }
</script>
